name: Keep Supabase Alive

# Supabase's free tier pauses a project after 7 days with no API activity.
# This workflow pings the database twice a week (well inside that window)
# so the project never auto-pauses from simple inactivity.

on:
  schedule:
    - cron: '0 12 * * 1,4'   # Every Monday and Thursday at 12:00 UTC
  workflow_dispatch:          # Also allows manually triggering a ping from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf \
            "https://blfvpcxnjznbvtgnmyvs.supabase.co/rest/v1/settings?select=key&limit=1" \
            -H "apikey: sb_publishable_yPSfmZnsAZTh1WD7Ccm_ag_NNUig5Mu" \
            -H "Authorization: Bearer sb_publishable_yPSfmZnsAZTh1WD7Ccm_ag_NNUig5Mu" \
            -o /dev/null -w "Ping response code: %{http_code}\n"
